services:
  - type: web
    name: 3love
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: 3love_production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: RATE_LIMIT_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /create-account
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /account
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /account
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_AUTOMATIC_TAX_ENABLED
        value: "false"
      - key: SHIPPING_GBP_PENCE
        value: "0"
      - key: STRIPE_SHIPPING_RATE_ID
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
